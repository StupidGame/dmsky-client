name: Set up DMSKY Flutter
description: Install the pinned SDK and locked dependencies
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: .fvmrc
        cache: true
    - name: Install locked dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile
