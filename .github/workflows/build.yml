name: Build all platforms
run-name: "Build app files #${{ github.run_number }} · ${{ github.event.pull_request.head.ref || github.ref_name }}"

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:
    inputs:
      android_apk:
        description: "Android APK type"
        type: choice
        options: [arm64, universal]
        default: arm64
        required: true
      build_aab:
        description: "Also build Android App Bundle (AAB)"
        type: boolean
        default: false
        required: false
      web_base_href:
        description: "Web hosting path (must start and end with /)"
        type: string
        default: "/"
        required: true

permissions:
  contents: read

env:
  DMSKY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DMSKY_RETENTION_DAYS: "14"

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    name: Signed Android release APK
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DMSKY_ANDROID_VARIANT: ${{ inputs.android_apk || 'arm64' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Prepare build identity
        run: node .github/scripts/build-artifacts.cjs prepare android
      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            .github/workflows/build.yml
            .fvmrc
            pubspec.lock
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ inputs.android_apk == 'universal' && 'armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android' || 'aarch64-linux-android' }}
      - name: Set up Flutter and locked packages
        uses: ./.github/actions/setup-flutter
      - name: Select Android architecture
        run: |
          if [ "$DMSKY_ANDROID_VARIANT" = universal ]; then
            echo "DMSKY_ANDROID_TARGETS=android-arm,android-arm64,android-x64" >> "$GITHUB_ENV"
            echo "DMSKY_ANDROID_APK=dmsky-client-universal-$DMSKY_BUILD_ID.apk" >> "$GITHUB_ENV"
          else
            echo "DMSKY_ANDROID_TARGETS=android-arm64" >> "$GITHUB_ENV"
            echo "DMSKY_ANDROID_APK=dmsky-client-arm64-$DMSKY_BUILD_ID.apk" >> "$GITHUB_ENV"
          fi
      - name: Restore the fixed Android signing key
        env:
          ANDROID_SIGNING_PASSPHRASE: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
        run: python3 tool/decrypt_android_signing.py
      - name: Build the signed APK
        run: python3 tool/run_with_download_retry.py flutter build apk --no-tree-shake-icons --release --target-platform "$DMSKY_ANDROID_TARGETS" --build-number "${{ github.run_number }}"
      - name: Build Android app bundle
        if: inputs.build_aab == true
        run: python3 tool/run_with_download_retry.py flutter build appbundle --no-tree-shake-icons --release --target-platform "$DMSKY_ANDROID_TARGETS" --build-number "${{ github.run_number }}"
      - name: Package Android files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$DMSKY_ANDROID_APK"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/dmsky-client-$DMSKY_BUILD_ID.aab"
          fi
          cp android/signing/certificate.sha256 dist/signing-certificate.sha256
          cd dist
          files=( *.apk )
          for file in *.aab; do
            if [ -f "$file" ]; then files+=( "$file" ); fi
          done
          sha256sum "${files[@]}" > SHA256SUMS
      - name: Write artifact information
        run: node .github/scripts/build-artifacts.cjs metadata android
      - name: Upload android files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.DMSKY_ARTIFACT_NAME }}
          path: ${{ env.DMSKY_ARTIFACT_PATH }}
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error
      - name: Remove decrypted signing files
        if: always()
        shell: python
        run: |
          import os, pathlib, shutil
          shutil.rmtree(pathlib.Path(os.environ["RUNNER_TEMP"]) / "dmsky-client-signing", ignore_errors=True)

  ios:
    name: Unsigned iOS files
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Prepare build identity
        run: node .github/scripts/build-artifacts.cjs prepare ios
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios
      - name: Set up Flutter and locked packages
        uses: ./.github/actions/setup-flutter
      - name: Build the unsigned device app
        run: |
          flutter build ios --no-tree-shake-icons --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"
      - name: Package the unsigned IPA
        run: |
          package_root="$RUNNER_TEMP/dmsky-ios-unsigned"
          mkdir -p "$package_root/Payload" dist
          /usr/bin/ditto build/ios/iphoneos/Runner.app "$package_root/Payload/DMSKY Client.app"
          (
            cd "$package_root"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/dmsky-client-ios-unsigned-$DMSKY_BUILD_ID.ipa" Payload
          )
          cat > dist/ARTIFACTS.txt <<'INFO'
          The IPA is unsigned. Install it on a device after signing it with an Apple certificate and provisioning profile.
          This workflow does not use Apple credentials.
          See BUILD_INFO.json for the Actions run ID, source commit and build attempt.
          INFO
      - name: Write artifact information
        run: node .github/scripts/build-artifacts.cjs metadata ios
      - name: Upload ios files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.DMSKY_ARTIFACT_NAME }}
          path: ${{ env.DMSKY_ARTIFACT_PATH }}
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error

  macos:
    name: macOS desktop app
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Prepare build identity
        run: node .github/scripts/build-artifacts.cjs prepare macos
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Set up Flutter and locked packages
        uses: ./.github/actions/setup-flutter
      - name: Build the Universal macOS app
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          flutter build macos --no-tree-shake-icons --release --build-number "$GITHUB_RUN_NUMBER"
      - name: Package the macOS app
        run: |
          mkdir -p dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/DMSKY Client.app" "dist/dmsky-client-macos-$DMSKY_BUILD_ID.zip"
      - name: Write artifact information
        run: node .github/scripts/build-artifacts.cjs metadata macos
      - name: Upload macos files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.DMSKY_ARTIFACT_NAME }}
          path: ${{ env.DMSKY_ARTIFACT_PATH }}
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error

  linux:
    name: Linux desktop app
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Prepare build identity
        run: node .github/scripts/build-artifacts.cjs prepare linux
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libstdc++-12-dev liblzma-dev nasm
      - name: Set up Flutter and locked packages
        uses: ./.github/actions/setup-flutter
      - name: Build the Linux app
        run: |
          flutter build linux --no-tree-shake-icons --release --build-number "$GITHUB_RUN_NUMBER"
      - name: Package the Linux app
        run: |
          package_root="$RUNNER_TEMP/dmsky-client-linux"
          cp -a build/linux/x64/release/bundle "$package_root"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/dmsky-client-linux-x64-$DMSKY_BUILD_ID.tar.gz" dmsky-client-linux
      - name: Write artifact information
        run: node .github/scripts/build-artifacts.cjs metadata linux
      - name: Upload linux files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.DMSKY_ARTIFACT_NAME }}
          path: ${{ env.DMSKY_ARTIFACT_PATH }}
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows desktop app
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Prepare build identity
        run: node .github/scripts/build-artifacts.cjs prepare windows
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Set up Flutter and locked packages
        uses: ./.github/actions/setup-flutter
      - name: Build the Windows app with Visual C++ runtime
        shell: pwsh
        run: |
          flutter build windows --no-tree-shake-icons --release --build-number $env:GITHUB_RUN_NUMBER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($library in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            Copy-Item (Join-Path $env:WINDIR "System32/$library") $bundle
          }
      - name: Write artifact information
        run: node .github/scripts/build-artifacts.cjs metadata windows
      - name: Upload windows files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.DMSKY_ARTIFACT_NAME }}
          path: ${{ env.DMSKY_ARTIFACT_PATH }}
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 6
          if-no-files-found: error

  web:
    name: Web app files
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Prepare build identity
        run: node .github/scripts/build-artifacts.cjs prepare web
      - name: Set up Flutter and locked packages
        uses: ./.github/actions/setup-flutter
      - name: Build the Web app
        env:
          DMSKY_WEB_BASE_HREF: ${{ inputs.web_base_href || '/' }}
        run: |
          flutter build web --no-wasm-dry-run --no-tree-shake-icons --release --build-number "$GITHUB_RUN_NUMBER" --base-href "$DMSKY_WEB_BASE_HREF"
      - name: Write artifact information
        run: node .github/scripts/build-artifacts.cjs metadata web
      - name: Upload web files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.DMSKY_ARTIFACT_NAME }}
          path: ${{ env.DMSKY_ARTIFACT_PATH }}
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 6
          if-no-files-found: error

  downloads:
    name: Downloads
    needs: [android, ios, macos, linux, windows, web]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Find downloads from every attempt of this run
        id: prepare
        uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/scripts/downloads.cjs').prepare({github, context, core});
      - name: Restore Android download to this attempt
        if: steps.prepare.outputs.restore_android == 'true'
        id: restore_android
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact_name_android }}
          path: ${{ runner.temp }}/dmsky-downloads/android/
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error
      - name: Restore iOS download to this attempt
        if: steps.prepare.outputs.restore_ios == 'true'
        id: restore_ios
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact_name_ios }}
          path: ${{ runner.temp }}/dmsky-downloads/ios/
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error
      - name: Restore macOS download to this attempt
        if: steps.prepare.outputs.restore_macos == 'true'
        id: restore_macos
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact_name_macos }}
          path: ${{ runner.temp }}/dmsky-downloads/macos/
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error
      - name: Restore Linux download to this attempt
        if: steps.prepare.outputs.restore_linux == 'true'
        id: restore_linux
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact_name_linux }}
          path: ${{ runner.temp }}/dmsky-downloads/linux/
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error
      - name: Restore Windows download to this attempt
        if: steps.prepare.outputs.restore_windows == 'true'
        id: restore_windows
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact_name_windows }}
          path: ${{ runner.temp }}/dmsky-downloads/windows/
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 6
          if-no-files-found: error
      - name: Restore Web download to this attempt
        if: steps.prepare.outputs.restore_web == 'true'
        id: restore_web
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact_name_web }}
          path: ${{ runner.temp }}/dmsky-downloads/web/
          retention-days: ${{ env.DMSKY_RETENTION_DAYS }}
          compression-level: 6
          if-no-files-found: error
      - name: Show downloads on the run summary
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/github-script@v9
        env:
          DMSKY_DOWNLOAD_STEPS: ${{ toJSON(steps) }}
          DMSKY_DOWNLOAD_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            await require('./.github/scripts/downloads.cjs').publishSummary({context, core});
